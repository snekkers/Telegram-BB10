# C-only build for the BB10 ARMv7 softfp ABI. No Linux platform assumptions.
my %targets = (
    "bb10-armv7" => {
        inherit_from => [ "BASE_unix" ],
        CC => "arm-blackberry-qnx8eabi-gcc",
        CXX => "arm-blackberry-qnx8eabi-g++",
        CFLAGS => "-O2 -fPIC -pthread -DNO_SYSLOG",
        CXXFLAGS => "-O2 -fPIC -pthread -DNO_SYSLOG",
        AR => "arm-blackberry-qnx8eabi-ar",
        RANLIB => "arm-blackberry-qnx8eabi-ranlib",
        bn_ops => "BN_LLONG",
        thread_scheme => "pthreads",
        dso_scheme => "dlfcn",
        ex_libs => "-lsocket -ldl -pthread",
    },
);
